name: Reproducibility Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gptzero-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies (Locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Validate Dataset Manifest
        run: |
          python -m unittest tests.test_dataset_manifest

      - name: Run Reproducibility Tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
